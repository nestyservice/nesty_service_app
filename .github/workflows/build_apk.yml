name: Build Nesty POS APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug & Release APK
        working-directory: ./android-pos
        run: |
          gradle assembleDebug assembleRelease --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          if [ -f android-pos/app/build/outputs/apk/release/app-release.apk ]; then
            cp android-pos/app/build/outputs/apk/release/app-release.apk output/nesty-pos.apk
          elif [ -f android-pos/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android-pos/app/build/outputs/apk/release/app-release-unsigned.apk output/nesty-pos.apk
          else
            cp android-pos/app/build/outputs/apk/debug/app-debug.apk output/nesty-pos.apk
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesty-pos-apk
          path: output/nesty-pos.apk

