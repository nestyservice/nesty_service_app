services:
  - type: web
    name: nesty-campus-canteen
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        value: admin@cvr.ac.in
      - key: ADMIN_DEFAULT_PASSWORD
        generateValue: true
      - key: RAZORPAY_KEY_ID
        value: rzp_test_NestyCampusKeyId
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: APP_URL
        value: https://nesty-service-app.onrender.com
      - key: BREVO_API_KEY
        sync: false
      - key: CAMPUS_EMAIL_SENDER
        sync: false
      - key: CAMPUS_EMAIL_SENDER_NAME
        value: "NESTY Campus Canteen"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
