services:
  - type: web
    name: nesty-campus-canteen
    runtime: node
    rootDir: web
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        value: admin@cvr.ac.in
      - key: ADMIN_DEFAULT_PASSWORD
        value: admin123
      - key: RAZORPAY_KEY_ID
        value: rzp_test_NestyCampusKeyId
      - key: RAZORPAY_KEY_SECRET
        sync: false
